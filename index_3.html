<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MORTEN360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--muted:#a3a3a3;--faint:#8a8a8a;--rule:#262626;--line:#3a3a3a;--panel:#111;--panel2:#1a1a1a;--g:#32d74b;--a:#ff9f0a;--r:#ff453a;--b:#6cb2ff;--n:#8a8a8a;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--muted:#a3a3a3;--faint:#8a8a8a;--rule:#262626;--line:#3a3a3a;--panel:#111;--panel2:#1a1a1a;--g:#32d74b;--a:#ff9f0a;--r:#ff453a;--b:#6cb2ff;--n:#8a8a8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--muted:#a3a3a3;--faint:#8a8a8a;--rule:#262626;--line:#3a3a3a;--panel:#111;--panel2:#1a1a1a;--g:#32d74b;--a:#ff9f0a;--r:#ff453a;--b:#6cb2ff;--n:#8a8a8a;color-scheme:dark}
:root[data-theme="light"]{--bg:#fff;--fg:#000;--muted:#525252;--faint:#6b6b6b;--rule:#e5e5e5;--line:#c4c4c4;--panel:#f4f4f4;--panel2:#ececec;--g:#15803d;--a:#b45309;--r:#dc2626;--b:#1d4ed8;--n:#6b6b6b;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Archivo','Helvetica Neue',Helvetica,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wm{font-stretch:125%;font-size:20px;line-height:1;text-transform:uppercase;display:inline-flex;align-items:center;min-height:44px}
.wm b{font-weight:900}.wm span{font-weight:400}
.disp{font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:.95}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.g{--c:var(--g)}.a{--c:var(--a)}.r{--c:var(--r)}.b{--c:var(--b)}.n{--c:var(--n)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--c);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.full{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:6px;gap:2px}
.seg>*{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:4px;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg>[aria-current="page"],.seg>[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.h1{margin:0;font-stretch:125%;font-weight:900;text-transform:uppercase;line-height:.95;font-size:clamp(32px,5vw,44px)}
.h2{margin:0;font-stretch:110%;font-weight:800;font-size:20px}
.h3{margin:0;font-weight:700;font-size:16px}
.lede{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:70ch}
.sec{display:flex;flex-direction:column;gap:14px}
.row-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:36px}
.list{border-top:1px solid var(--rule)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
a.item:hover .t,a.card:hover .city,a.trow:hover .t{text-decoration:underline;text-underline-offset:3px}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t{font-weight:600;font-size:15px}
.item .s{font-size:13px;color:var(--muted)}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;font-size:13px;font-weight:600;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:8px;padding:clamp(16px,2.5vw,24px)}
.chev{color:var(--faint)}
.empty{margin:0;padding:16px 0;color:var(--muted);border-bottom:1px solid var(--rule)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:0 0 8px -6px;font-size:14px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--fg)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 24px}
.kv div{display:flex;flex-direction:column;gap:3px}.kv .k{font-size:12px;color:var(--muted)}.kv .v{font-size:15px;font-weight:600}
select.sel{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;max-width:100%}
input.in,select.in{width:100%;min-height:44px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:15px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,460px);padding:12px 16px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

/* ---------- Operations shell ---------- */
.ops{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--rule);padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;display:flex;flex-direction:column;gap:22px}
.side .wm{padding:0 8px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border-radius:6px;font-size:14px;font-weight:500;color:var(--muted)}
.snav a:hover{background:var(--panel);color:var(--fg)}
.snav a[aria-current="page"]{background:var(--panel2);color:var(--fg);font-weight:700}
.snav .cnt{margin-left:auto;font-size:12px;color:var(--faint)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;font-weight:800}
.snav .badge{margin-left:auto}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 8px 0;border-top:1px solid var(--rule)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 40px;border-bottom:1px solid var(--rule);position:relative;z-index:15}
.search{position:relative;flex:1 1 220px;max-width:560px}
.search label{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:none;color:var(--fg);font-size:14px}
.search input:focus{outline:none}
.search label:focus-within{border-color:var(--fg)}
.results{position:absolute;left:0;right:0;top:50px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;display:none;max-height:60vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.6)}
.results.on{display:block}
.results a{display:flex;justify-content:space-between;gap:12px;padding:10px;border-radius:6px;font-size:14px}
.results a:hover,.results a:focus{background:var(--panel2)}
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--r)}
.spacer{flex:1}
main{display:block;outline:none}
.opsmain{width:100%;max-width:1240px;padding:32px 40px 72px}
.mtab{display:none;position:sticky;bottom:0;z-index:20;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--rule);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));margin-top:auto}
.mtab a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;font-weight:500;color:var(--faint)}
.mtab a[aria-current="page"]{color:var(--fg);font-weight:700}
.mtab .ico{position:relative;display:flex}
.mtab .badge{position:absolute;top:-6px;right:-12px;min-width:18px;height:18px;font-size:10px}
@media (max-width: 899px){
  .side{display:none}.mtop{display:flex}.mtab{display:grid}
  .head{padding:10px 16px;flex-wrap:nowrap}.head .lbl{display:none}.head .spacer{display:none}.search{flex:1 1 auto;min-width:0}.head .btn{padding:0 14px}
  .opsmain{padding:24px 16px 32px}
}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--rule)}
.kpis a{background:var(--bg);padding:16px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:inset -1px 0 0 var(--rule),inset 0 -1px 0 var(--rule)}
.kpis a:hover{background:var(--panel)}
.kpis .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpis .v{font-stretch:125%;font-weight:800;font-size:30px;line-height:1}
.kpis .s{font-size:12px;color:var(--muted)}
.kdot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.duo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.duo>.span2{grid-column:span 2}
@media (max-width: 1199px){.duo{grid-template-columns:minmax(0,1fr)}.duo>.span2{grid-column:auto}}
.spot .city{font-size:clamp(52px,7vw,76px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:var(--faint)}
.card .city{font-stretch:125%;font-weight:900;font-size:24px;line-height:1;text-transform:uppercase}
.card .foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.card .foot b{display:block;font-size:14px;color:var(--fg);font-weight:600}
.alerts .trow{display:flex;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--rule);font-size:14px}
.alerts .c1{width:170px;flex-shrink:0}.alerts .c2{width:190px;flex-shrink:0;font-weight:600}.alerts .c3{flex:1;min-width:0;color:var(--muted)}.alerts .c4{width:140px;flex-shrink:0;color:var(--muted)}.alerts .c5{width:120px;flex-shrink:0;text-align:right;font-weight:600}
.alerts .thead{font-size:12px;color:var(--muted);padding:8px 0}
@media (max-width: 760px){
  .alerts .thead{display:none}
  .alerts .trow{flex-wrap:wrap;gap:4px 12px}
  .alerts .c1{flex:1 1 auto;width:auto}.alerts .c5{order:1;width:auto}
  .alerts .c2,.alerts .c3,.alerts .c4{order:2;flex:1 1 100%;width:auto}
}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px 13px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr[data-href]{cursor:pointer}.tbl tr[data-href]:hover td{background:var(--panel)}
.tw{overflow-x:auto}

/* Show workspace */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--rule);margin:24px 0 28px;scrollbar-width:none}
.tabs a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--fg)}
.tl{border-left:1px solid var(--line);margin-left:6px;padding-left:20px;display:flex;flex-direction:column;gap:0}
.tl .ev{position:relative;padding:12px 0;border-bottom:1px solid var(--rule)}
.tl .ev::before{content:"";position:absolute;left:-26px;top:18px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--fg));border:2px solid var(--bg)}
.tl .time{font-variant-numeric:tabular-nums;font-weight:800;font-stretch:115%;font-size:17px;margin-right:12px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--rule);width:100%;background:transparent;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer;font-size:15px}
.box{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk[aria-pressed="true"] .box{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chk[aria-pressed="true"] .lbl2{color:var(--muted);text-decoration:line-through}

/* Kanban */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--panel);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcard{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cal .wd{background:var(--bg);padding:8px;font-size:12px;color:var(--muted);text-align:center}
.cal .d{background:var(--bg);min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.cal .d.out{color:var(--faint)}.cal .d.today .num{background:var(--fg);color:var(--bg)}
.cal .num{align-self:flex-start;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;padding:0 6px}
.cal .ev2{display:block;padding:3px 6px;border-radius:4px;background:var(--panel2);border-left:3px solid var(--c);font-size:11px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width: 760px){.cal .d{min-height:56px}.cal .ev2{font-size:0;padding:0;height:6px;border-left:none;background:var(--c)}}

/* Morten view */
.mv{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.mv .mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.mv main{flex:1;padding:8px 20px 32px;display:flex;flex-direction:column;gap:32px}
.mv .mtab{display:grid}
.tonight{background:var(--fg);color:var(--bg);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tonight .city{font-size:60px}
.tonight .sub{color:var(--muted)}
:root:not([data-theme="light"]) .tonight .sub{color:#404040}
.tonight .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:14px;border-top:1px solid rgba(127,127,127,.3)}
.tonight .grid3 span{display:block}
.tonight .btn{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.dcard{border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.reco{background:var(--panel2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:6px;background:transparent;text-align:left;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg);background:var(--panel)}
.opt .tag{font-size:11px;font-weight:800;color:var(--g)}
.done{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--g)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ================= helpers ================= */
var TODAY='2026-10-01';
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function iso(d){return d.toISOString().slice(0,10);}
function add(s,n){var t=pd(s);t.setUTCDate(t.getUTCDate()+n);return iso(t);}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function fmt(s){var t=pd(s);return WD[t.getUTCDay()]+' '+t.getUTCDate()+' '+MO[t.getUTCMonth()];}
function fmtY(s){var t=pd(s);return fmt(s)+(t.getUTCFullYear()!==2026?' '+t.getUTCFullYear():'');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function when(s){var d=diff(TODAY,s);return d===0?'Today':d===1?'Tomorrow':d<0?(-d)+' day'+(d===-1?'':'s')+' late':'In '+d+' days';}
var P={
grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
ticket:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10"/>',
tasks:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/>',
flag:'<path d="M5 21V4h12l-2.5 4.5L17 13H5"/>',
team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6 6 0 0 1 3.5 5.5"/>',
doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',

function mToday(){var n=upcoming()[0];var p=pending();
 var t='<section class="tonight" aria-label="Next show"><div class="row-h"><b>Tonight</b><span style="display:inline-flex;gap:6px;align-items:center;font-weight:700;color:#15803d">'+ic('check',16,2.5)+'Ready</span></div><div style="display:flex;flex-direction:column;gap:6px"><span class="disp city">'+esc(n.city)+'</span><span class="sub">'+esc(n.venue)+', '+esc(n.country)+'</span></div><div class="grid3"><div><span class="tiny sub">Pick-up</span><b style="font-size:19px">21:30</b></div><div><span class="tiny sub">On stage</span><b style="font-size:19px">23:30</b></div><div><span class="tiny sub">Local time</span><b style="font-size:19px">'+n.tz+'</b></div></div><span class="small sub">Tomorrow: <a href="#/m/show/deadsea" style="text-decoration:underline">the Dead Sea</a>, then <a href="#/m/show/ibiza" style="text-decoration:underline">Ibiza</a>.</span><a class="btn full" href="#/m/schedule">Tonight\'s schedule</a></section>';
 var first=p[0];
 var dd='<section class="sec"><div class="row-h"><h1 class="h2">Waiting for you</h1><a class="small muted" href="#/m/decisions" style="text-decoration:underline">'+p.length+' decision'+(p.length===1?'':'s')+'</a></div>'+
  (first?mDecShort(first,true):'<p class="empty">Nothing waiting. Enjoy the show.</p>')+
  '<div class="list">'+p.slice(1).map(function(d){return '<a class="item" href="#/m/decision/'+d.id+'"><span class="grow"><span class="t">'+esc(d.short)+'</span><span class="s">Recommended: '+esc(d.options.filter(function(o){return o.reco;})[0].t.toLowerCase())+'. By '+decDue(d)+'</span></span><span class="chev">'+ic('right',16,2)+'</span></a>';}).join('')+'</div><a class="small muted" href="#/m/decisions#completed" style="text-decoration:underline;min-height:44px;display:inline-flex;align-items:center">Completed decisions</a></section>';
 return t+dd;}
function mDecShort(d,urgent){var s=show(d.show);var r=d.options.filter(function(o){return o.reco;})[0];
 return '<article class="dcard"><div class="row-h"><span class="st '+(d.bucket==='Urgent today'?'r':'a')+'">'+ic(d.bucket==='Urgent today'?'alert':'clock',14,2)+d.bucket+'</span><b class="small" style="color:var(--'+(d.bucket==='Urgent today'?'r':'fg')+')">By '+decDue(d).replace(/^Today /,'')+'</b></div><div style="display:flex;flex-direction:column;gap:4px"><h2 class="h3" style="font-size:18px">'+esc(d.title)+'</h2><a class="small muted" href="#/m/show/'+s.id+'" style="text-decoration:underline;align-self:flex-start">'+esc(s.city)+', '+esc(s.venue)+', '+fmt(s.date)+'</a></div><p style="margin:0">'+esc(d.why)+'</p><div class="reco"><span class="tiny muted" style="font-weight:700">Recommended by '+esc(d.recoBy)+'</span><span style="font-weight:600">'+esc(d.reco)+'</span></div><div class="opts"><button type="button" class="btn" data-dec="'+d.id+'" data-v="'+r.v+'">Approve '+(r.v.length===1?r.v:'')+'</button><a class="btn ghost" href="#/m/decision/'+d.id+'">See options</a></div></article>';}
function mDecisions(){var p=pending();var b=['Urgent today','This week','Upcoming'].map(function(bk){var l=p.filter(function(d){return d.bucket===bk;});return l.length?'<section class="sec"><h2 class="h2">'+bk+'</h2><div class="list">'+l.map(function(d){return '<a class="item" href="#/m/decision/'+d.id+'"><span class="grow"><span class="t">'+esc(d.short)+'</span><span class="s">'+esc(show(d.show).city)+'. By '+decDue(d)+'</span></span><span class="chev">'+ic('right',16,2)+'</span></a>';}).join('')+'</div></section>':'';}).join('');
 var done=DECISIONS.filter(function(d){return state.dec[d.id];});
 return '<h1 class="h1">Decisions</h1>'+(b||'<p class="empty">Nothing waiting for you.</p>')+'<section class="sec"><h2 class="h2">For information</h2><div class="list">'+FYI.map(function(f){return '<div class="item"><span class="grow"><span class="t">'+esc(f.t)+'</span><span class="s">'+esc(f.s)+'</span></span></div>';}).join('')+'</div></section><section class="sec" id="completed"><h2 class="h2">Completed</h2><div class="list">'+done.map(function(d){return '<a class="item" href="#/m/decision/'+d.id+'"><span class="grow"><span class="t">'+esc(d.short)+'</span><span class="s">Today</span></span><span class="st g">'+ic('check',14,2)+esc(decLabel(d,state.dec[d.id]))+'</span></a>';}).join('')+COMPLETED.map(function(c){return '<div class="item"><span class="grow"><span class="t">'+esc(c.t)+'</span><span class="s">'+c.d+'</span></span><span class="st g">'+ic('check',14,2)+c.r+'</span></div>';}).join('')+'</div></section>';}
function mDecision(id){var d=decision(id);if(!d){return '<h1 class="h1">Not found</h1>';}return crumb('#/m/decisions','Decisions')+decCard(d,'#/m/');}
function mSchedule(){var sc=[['21:30','Pick-up at the hotel','[Driver name]'],['22:00','Arrive at The Village West','Artist entrance'],['23:30','On stage','90 minutes'],['01:00','Set ends',''],['01:30','Back at the hotel',''],['08:30','Pick-up for the airport','Flight to Amman']];
 return crumb('#/m','Today')+'<div><span class="small muted">Tonight, Thu 1 Oct</span><h1 class="h1" style="font-size:56px;margin-top:6px">Giza</h1><span class="muted">The Village West, Egypt</span></div><section class="sec"><h2 class="h2">Schedule</h2><div class="tl">'+sc.map(function(r,i){return '<div class="ev"'+(i===2?' style="--c:var(--g)"':'')+'><span class="time">'+r[0]+'</span><b>'+esc(r[1])+'</b>'+(r[2]?'<div class="small muted" style="margin-left:0">'+esc(r[2])+'</div>':'')+'</div>';}).join('')+'</div></section><section class="sec"><h2 class="h2">Tomorrow</h2><div class="list"><a class="item" href="#/m/show/deadsea"><span class="grow"><span class="t">Dead Sea</span><span class="s">Panorama Dead Sea, Jordan</span></span><span class="chev">'+ic('right',16,2)+'</span></a><a class="item" href="#/m/show/ibiza"><span class="grow"><span class="t">Ibiza</span><span class="s">UNVRS, late night</span></span><span class="chev">'+ic('right',16,2)+'</span></a></div></section>';}
function mShows(){return '<h1 class="h1">Shows</h1><div class="list">'+upcoming().map(function(s){return '<a class="item" href="#/m/show/'+s.id+'"><span style="width:44px;font-stretch:125%;font-weight:800;font-size:20px">'+String(pd(s.date).getUTCDate()).padStart(2,'0')+'<span class="tiny muted" style="display:block;font-weight:500">'+MO[pd(s.date).getUTCMonth()]+'</span></span><span class="grow"><span class="t disp" style="font-size:19px">'+esc(s.city)+'</span><span class="s">'+esc(s.venue)+'</span></span>'+stLine(s)+'</a>';}).join('')+'</div>';}
function mShow(id){var s=show(id);if(!s){return '<h1 class="h1">Not found</h1>';}var dec=pending().filter(function(d){return d.show===id;});
 return crumb('#/m/shows','Shows')+'<div><span class="small muted">'+fmtY(s.date)+'</span><h1 class="h1" style="font-size:52px;margin:6px 0">'+esc(s.city)+'</h1><span class="muted">'+esc(s.venue)+(s.sample?'':', '+esc(s.country))+'</span><div style="margin-top:10px">'+stLine(s)+'</div></div>'+
 (dec.length?'<section class="sec"><h2 class="h2">Needs you</h2>'+dec.map(function(d){return mDecShort(d);}).join('')+'</section>':'<p class="muted" style="margin:0">Nothing needs you for this show. The team is on it.</p>')+
 '<div class="kv"><div><span class="k">On stage</span><span class="v">'+(s.set||'To be confirmed')+'</span></div><div><span class="k">Local time</span><span class="v">'+s.tz+'</span></div><div><span class="k">Travel</span><span class="v">'+esc(s.travel)+'</span></div><div><span class="k">Hotel</span><span class="v">'+esc(s.hotel)+'</span></div></div>';}
function mContacts(){var c=[['Célia','Operations, your first call for anything'],['[Driver name]','Driver tonight in Giza'],['[Promoter name]','Promoter tonight in Giza'],['Booking Global','Booking, rest of world'],['Booking US','Booking, US and South America']];
 return '<h1 class="h1">Contacts</h1><div class="list">'+c.map(function(x){return '<div class="item"><span class="grow"><span class="t">'+x[0]+'</span><span class="s">'+x[1]+'</span></span><button type="button" class="btn ghost sm" data-toast="Calling '+x[0]+'… (prototype)">'+ic('phone',14)+'<span class="sr">Call '+x[0]+'</span></button><button type="button" class="btn ghost sm" data-toast="Message to '+x[0]+' (prototype)">'+ic('msg',14)+'<span class="sr">Message '+x[0]+'</span></button></div>';}).join('')+'</div>';}

/* ================= shells ================= */
var NAV=[['dashboard','#/ops','grid','Dashboard'],['calendar','#/ops/calendar','cal','Calendar'],['shows','#/ops/shows','ticket','Shows'],['tasks','#/ops/tasks','tasks','My tasks'],['attention','#/ops/attention','flag',"Morten's attention"],['team','#/ops/team','team','Team'],['documents','#/ops/documents','doc','Documents'],['finances','#/ops/finances','money','Finances'],['contacts','#/ops/contacts','contacts','Contacts'],['reports','#/ops/reports','reports','Reports'],['settings','#/ops/settings','settings','Settings']];
function toggle(cur){return '<div class="seg" role="group" aria-label="View"><a href="#/ops"'+(cur==='ops'?' aria-current="page"':'')+'>Operations</a><a href="#/m"'+(cur==='m'?' aria-current="page"':'')+'>Morten</a></div>';}
function opsShell(page,active){var p=pending().length,mine=tasks().filter(function(t){return t.owner==='ops'&&t.status!=='Completed';}).length;
 var side='<aside class="side"><a class="wm" href="#/ops"><b>Morten</b><span>360</span></a>'+toggle('ops')+'<nav class="snav" aria-label="Sections">'+NAV.map(function(n){var extra=n[0]==='attention'&&p?'<span class="badge">'+p+'</span>':n[0]==='tasks'?'<span class="cnt">'+mine+'</span>':'';return '<a href="'+n[1]+'"'+(n[0]===active?' aria-current="page"':'')+'>'+ic(n[2])+'<span>'+n[3]+'</span>'+extra+'</a>';}).join('')+'</nav><div class="me"><span class="avatar">C</span><span style="display:flex;flex-direction:column"><b style="font-size:14px">Célia</b><span class="tiny muted">Operations Manager</span></span></div></aside>';
 var mtop='<div class="mtop"><a class="wm" href="#/ops" style="font-size:18px"><b>Morten</b><span>360</span></a>'+toggle('ops')+'</div>';
 var hd='<header class="head"><div class="search"><label>'+ic('search')+'<span class="sr">Search</span><input id="q" type="search" placeholder="Search shows, tasks, contacts, documents" autocomplete="off"></label><div class="results" id="results"></div></div><span class="spacer"></span><a class="iconbtn" href="#/ops/notifications" aria-label="Notifications, 3 new">'+ic('bell',20)+'<span class="dot" aria-hidden="true"></span></a><a class="btn" href="#/ops/new" aria-label="Create new show">'+ic('plus',18,2)+'<span class="lbl">Create new show</span></a></header>';
 var mt=[['dashboard','#/ops','grid','Dashboard'],['shows','#/ops/shows','ticket','Shows'],['tasks','#/ops/tasks','tasks','Tasks'],['attention','#/ops/attention','flag','Morten'],['more','#/ops/more','menu','More']];
 var mtab='<nav class="mtab" aria-label="Main">'+mt.map(function(n){var on=n[0]===active||(n[0]==='more'&&['calendar','team','documents','finances','contacts','reports','settings','notifications','new','more'].indexOf(active)>-1);return '<a href="'+n[1]+'"'+(on?' aria-current="page"':'')+'><span class="ico">'+ic(n[2],22)+(n[0]==='attention'&&p?'<span class="badge">'+p+'</span>':'')+'</span><span>'+n[3]+'</span></a>';}).join('')+'</nav>';
 return '<div class="ops">'+side+'<div class="col">'+mtop+hd+'<main id="main" class="opsmain" tabindex="-1">'+page+'</main>'+mtab+'</div></div>';}
function mShell(page,active){var p=pending().length;var mt=[['today','#/m','home','Today'],['decisions','#/m/decisions','flag','Decisions'],['schedule','#/m/schedule','cal','Schedule'],['shows','#/m/shows','ticket','Shows'],['contacts','#/m/contacts','phone','Contacts']];
 return '<div class="mv"><header class="mh"><a class="wm" href="#/m"><b>Morten</b><span>360</span></a>'+toggle('m')+'</header><main id="main" tabindex="-1"><span class="small muted" style="margin-bottom:-16px">Thursday 1 October</span>'+page+'</main><nav class="mtab" aria-label="Main">'+mt.map(function(n){return '<a href="'+n[1]+'"'+(n[0]===active?' aria-current="page"':'')+'><span class="ico">'+ic(n[2],22)+(n[0]==='decisions'&&p?'<span class="badge">'+p+'</span>':'')+'</span><span>'+n[3]+'</span></a>';}).join('')+'</nav></div>';}

/* ================= router ================= */
function route(){var h=(location.hash||'#/ops').replace(/^#\/?/,'');var a=h.split('/').filter(Boolean);if(!a.length){a=['ops'];}return a;}
function render(nav){
 var a=route(),html,title='MORTEN360';
 if(a[0]==='m'){
  var s=a[1]||'today',pg;
  if(s==='decisions'){pg=mDecisions();}else if(s==='decision'){pg=mDecision(a[2]);s='decisions';}else if(s==='schedule'){pg=mSchedule();}else if(s==='shows'){pg=mShows();}else if(s==='show'){pg=mShow(a[2]);s='shows';}else if(s==='contacts'){pg=mContacts();}else if(s==='doc'){pg=pDoc(a[2],'#/m/');s='today';}else{s='today';pg=mToday();}
  html=mShell(pg,s);title+=' | Morten';
 } else {
  var p=a[1]||'dashboard',page,act=p;
  switch(p){
   case 'shows':page=pShows(a[2]);if(a[2]){state.filter=a[2];}break;
   case 'show':page=pShow(a[2],a[3]);act='shows';break;
   case 'tasks':if(a[2]){state.tfilter=a[2];}else{state.tfilter='all';}page=pTasks(state.tfilter);break;
   case 'attention':page=pAttention(a[2]);break;
   case 'calendar':page=pCalendar();break;
   case 'team':page=pTeam(a[2]);break;
   case 'documents':page=pDocs();break;
   case 'doc':page=pDoc(a[2],'#/ops/');act='documents';break;
   case 'finances':page=pFinances();break;
   case 'contacts':page=pContacts();break;
   case 'reports':page=pReports();break;
   case 'settings':page=pSettings();break;
   case 'notifications':page=pNotifs();break;
   case 'more':page=pMore();break;
   case 'new':page=pNew();break;
   default:act='dashboard';page=pDashboard();
  }
  if(p==='shows'&&!a[2]){state.filter='all';page=pShows('all');}
  html=opsShell(page,act);
 }
 document.getElementById('app').innerHTML=html;document.title=title;
 if(nav){var anchor=null;if(a[0]==='ops'&&a[1]==='attention'&&a[2]){anchor=document.getElementById('d-'+a[2]);}if(location.hash.indexOf('#completed')>-1){anchor=document.getElementById('completed');}if(anchor&&anchor.scrollIntoView){anchor.scrollIntoView();}else{window.scrollTo(0,0);}var m=document.getElementById('main');if(m&&m.focus){try{m.focus({preventScroll:true});}catch(e){}}}
}
function rerender(){var y=window.scrollY||0;render(false);window.scrollTo(0,y);}
var tt=null;function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='on';clearTimeout(tt);tt=setTimeout(function(){t.className='';},2600);}

/* ================= events ================= */
document.addEventListener('click',function(e){
 var el=e.target.closest?e.target.closest('[data-dec],[data-toast],[data-view],[data-tview],[data-cal],[data-post],[data-set],[data-wizgo],tr[data-href]'):null;if(!el){return;}
 if(el.matches('tr[data-href]')){if(!e.target.closest('a')){location.hash=el.getAttribute('data-href');}return;}
 if(el.hasAttribute('data-dec')){var id=el.getAttribute('data-dec'),v=el.getAttribute('data-v');state.dec[id]=v||'';var d=decision(id);rerender();if(v){toast('Decided: '+decLabel(d,v)+'. '+team(d.from).name.replace(/^\[|\]$/g,'')+' notified, task updated.');}return;}
 if(el.hasAttribute('data-toast')){toast(el.getAttribute('data-toast'));return;}
 if(el.hasAttribute('data-view')){state.view=el.getAttribute('data-view');rerender();return;}
 if(el.hasAttribute('data-tview')){state.tview=el.getAttribute('data-tview');rerender();return;}
 if(el.hasAttribute('data-cal')){state.cal=el.getAttribute('data-cal');rerender();return;}
 if(el.hasAttribute('data-post')){var sid=el.getAttribute('data-post'),i=el.getAttribute('data-i');state.post[sid]=state.post[sid]||{};state.post[sid][i]=!state.post[sid][i];rerender();return;}
 if(el.hasAttribute('data-set')){var k=el.getAttribute('data-set');state.set[k]=!state.set[k];rerender();return;}
 if(el.hasAttribute('data-wizgo')){var g=el.getAttribute('data-wizgo'),w=state.wiz;
  if(g==='next'){if(w.step===1&&(!w.city||!w.date)){toast('Add at least a city and a date.');return;}w.step++;rerender();}
  else if(g==='back'){w.step--;rerender();}
  else{state.created++;var nid='new'+state.created;SHOWS.push({id:nid,date:w.date,city:w.city,country:w.country||'',venue:w.venue||'[Venue]',type:w.type,booking:'Provisional',lead:w.lead,status:'planning',ready:0,missing:['Contract','Deposit','Flights','Hotel','Tech rider','Content plan'],travel:'Not started',hotel:'Not started',contract:'Draft',deposit:'Not issued yet',production:'Not started',marketing:'Not started',set:null,tz:'[Time zone]'});
   [['Get the contract signed','Booking',w.lead,7],['Issue the deposit invoice','Finance','finance',14],['Book the flights','Travel','travel',21],['Book the hotel','Travel','travel',21],['Send the tech rider','Production','production',21],['Agree the content plan','Marketing','social',14]].forEach(function(x,j){TASKS.push({id:nid+'t'+j,title:x[0],show:nid,cat:x[1],owner:x[2],due:add(TODAY,x[3]),prio:'Normal',status:'Not started'});});
   state.wiz={step:1,city:'',country:'',venue:'',date:'',type:'Club show',lead:'booking',template:'Standard show'};toast('Show created with 6 standard tasks.');location.hash='#/ops/show/'+nid;}
  return;}
});
document.addEventListener('change',function(e){var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-task')){state['ts_'+t.getAttribute('data-task')]=t.value;rerender();toast('Status updated: '+t.value);}else if(t.hasAttribute&&t.hasAttribute('data-wiz')){state.wiz[t.getAttribute('data-wiz')]=t.value;}});
document.addEventListener('input',function(e){var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-wiz')){state.wiz[t.getAttribute('data-wiz')]=t.value;return;}
 if(t.id==='q'){var q=t.value.trim().toLowerCase();var r=document.getElementById('results');if(!q){r.className='results';r.innerHTML='';return;}
  var res=[];upcoming().forEach(function(s){if((s.city+' '+s.venue+' '+s.country).toLowerCase().indexOf(q)>-1){res.push(['#/ops/show/'+s.id,s.city,'Show, '+fmt(s.date)]);}});
  tasks().forEach(function(x){if(x.title.toLowerCase().indexOf(q)>-1){res.push(['#/ops/show/'+x.show+'/tasks',x.title,'Task, '+show(x.show).city]);}});
  TEAM.forEach(function(p){if((p.name+' '+p.role).toLowerCase().indexOf(q)>-1){res.push(['#/ops/team/'+p.id,p.name,'Team']);}});
  allDocs().forEach(function(d){if((d.name+' '+show(d.show).city).toLowerCase().indexOf(q)>-1){res.push(['#/ops/doc/'+d.id,d.name+', '+show(d.show).city,'Document']);}});
  r.innerHTML=res.length?res.slice(0,8).map(function(x){return '<a href="'+x[0]+'"><span>'+esc(x[1])+'</span><span class="tiny muted">'+esc(x[2])+'</span></a>';}).join(''):'<div class="small muted" style="padding:10px">No result for "'+esc(q)+'"</div>';r.className='results on';}
});
window.addEventListener('hashchange',function(){render(true);});
if(!location.hash){history.replaceState(null,'','#/ops');}
render(false);
window.__m360={render:render,state:state};
})();
</script>
